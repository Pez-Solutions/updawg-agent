# unwrap and expect are forbidden in the agent itself — it runs as root on other
# people's servers and a panic there is an outage. In tests they are the clearest
# way to assert, so they are allowed only there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Distribution and project names that are words, not code. `..` keeps
# clippy's own list.
doc-valid-idents = ["AlmaLinux", "ELevate", "CentOS", "SELinux", ".."]
