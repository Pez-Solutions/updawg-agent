# unwrap/expect/panic are linted in the agent but fine in tests.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Names that aren't code. `..` keeps clippy's defaults.
doc-valid-idents = ["AlmaLinux", "ELevate", "CentOS", "SELinux", "OpenPGP", "InRelease", ".."]
