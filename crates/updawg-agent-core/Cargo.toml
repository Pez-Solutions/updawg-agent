[package]
name = "updawg-agent-core"
description = "Scheduler, transport and local state for the Updawg agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Trust an extra CA, for testing against a local gateway. Never enabled in
# release builds. See `src/insecure.rs`.
insecure-extra-root = []

[dependencies]
updawg-protocol.workspace = true
updawg-backends.workspace = true
updawg-collectors.workspace = true
updawg-crypto.workspace = true
updawg-executor.workspace = true
updawg-snapshots.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# Self-update: manifest signature and binary checksums.
aws-lc-rs.workspace = true
base64.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

[dev-dependencies]
updawg-collectors = { workspace = true, features = ["testing"] }
# The transport tests run a TLS server that requires a client cert. Same
# versions reqwest already pulls in.
# x509-parser: the fake gateway signs the agent's CSR.
rcgen = { workspace = true, features = ["x509-parser"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls = "0.26"
x509-parser.workspace = true

[lints]
workspace = true
