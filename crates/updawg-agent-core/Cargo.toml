[package]
name = "updawg-agent-core"
description = "Scheduler, transport and local state for the Updawg agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Lets a binary be told to trust a certificate authority the platform does not
# (DAWG-206), for running against a gateway you started yourself. Off by
# default, and a release build does not turn it on: the point is that the
# binary people install has no way to accept the flag. See `src/insecure.rs`.
insecure-extra-root = []

[dependencies]
updawg-protocol.workspace = true
updawg-backends.workspace = true
updawg-collectors.workspace = true
updawg-crypto.workspace = true
updawg-executor.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
updawg-collectors = { workspace = true, features = ["testing"] }
base64.workspace = true
# The transport tests run a real TLS server that demands a client certificate.
# Both come in through reqwest already; naming them here keeps the versions in
# step with what it resolved.
rcgen.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls = "0.26"
x509-parser.workspace = true

[lints]
workspace = true
