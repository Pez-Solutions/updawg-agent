[package]
name = "updawg-protocol"
description = "Wire types for the Updawg agent API: the contract between the Updawg agent and its gateway."
# Versioned separately from the agent; bumped when the wire format changes.
version = "0.12.0"
edition.workspace = true
# Lower than the agent's MSRV on purpose, so consumers on older toolchains can
# use it. Edition 2024 is the real floor.
rust-version = "1.85"

license.workspace = true
repository.workspace = true
authors.workspace = true

homepage = "https://updawg.net"
documentation = "https://docs.rs/updawg-protocol"
readme = "README.md"
keywords = ["updawg", "patching", "linux", "agent", "protocol"]
categories = ["api-bindings", "network-programming", "os::linux-apis"]

include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
