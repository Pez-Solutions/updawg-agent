[workspace]
resolver = "3"
members = [
    "crates/updawg-protocol",
    "crates/updawg-crypto",
    "crates/updawg-collectors",
    "crates/updawg-backends",
    "crates/updawg-snapshots",
    "crates/updawg-executor",
    "crates/updawg-agent-core",
    "bin/updawgd",
    "bin/updawgctl",
    "tools/release-sign",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Needed by rcgen 0.14.10. We ship binaries, so there's no reason to keep
# this low.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Pez-Solutions/updawg-agent"
authors = ["Updawg"]

[workspace.dependencies]
# Only updawg-protocol is published.
updawg-protocol = { path = "crates/updawg-protocol", version = "0.12.0" }
updawg-crypto = { path = "crates/updawg-crypto" }
updawg-collectors = { path = "crates/updawg-collectors" }
updawg-backends = { path = "crates/updawg-backends" }
updawg-snapshots = { path = "crates/updawg-snapshots" }
updawg-executor = { path = "crates/updawg-executor" }
updawg-agent-core = { path = "crates/updawg-agent-core" }

anyhow = "1"
async-trait = "0.1"
# aws-lc-rs is the only crypto backend: rcgen (key pair, CSR), rustls (TLS)
# and signature verification all use it.
aws-lc-rs = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
# rustls with the platform verifier, so hosts behind TLS-inspecting proxies
# work with the system trust store.
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
x509-parser = "0.18"
serde_json = "1"
# Inventory uploads (800-2500 packages compress well).
zstd = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "signal", "sync"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# New in clippy 1.99; would rewrite every assert!(x.is_empty()) in the tests.
assert_is_empty = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
