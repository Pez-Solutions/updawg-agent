[package]
name = "updawgctl"
description = "Local command-line tool for the Updawg agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "updawgctl"
path = "src/main.rs"

[features]
# Adds --insecure-extra-root for testing against a local gateway. Never
# enabled in release builds.
insecure-extra-root = ["updawg-agent-core/insecure-extra-root"]

[dependencies]
updawg-agent-core.workspace = true
updawg-backends.workspace = true
updawg-collectors.workspace = true
updawg-crypto.workspace = true
updawg-protocol.workspace = true
updawg-snapshots.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
# `updawgctl sign` talks to the Updawg API.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# `updawgctl sign --policy`.
toml.workspace = true
tokio.workspace = true

[lints]
workspace = true
