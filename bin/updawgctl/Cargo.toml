[package]
name = "updawgctl"
description = "Local command-line tool for the Updawg agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "updawgctl"
path = "src/main.rs"

[features]
# Lets this binary be told to trust a certificate authority the platform does
# not, for running against a gateway you started yourself (DAWG-206). Off by
# default: with it off clap has never heard of `--insecure-extra-root`, so the
# binary people install cannot be talked into it. Release builds do not set it.
insecure-extra-root = ["updawg-agent-core/insecure-extra-root"]

[dependencies]
updawg-agent-core.workspace = true
updawg-backends.workspace = true
updawg-collectors.workspace = true
updawg-crypto.workspace = true
updawg-protocol.workspace = true
updawg-snapshots.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
# `updawgctl sign` talks to the Updawg API (DAWG-157).
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# `updawgctl sign --policy` (DAWG-293).
toml.workspace = true
tokio.workspace = true

[lints]
workspace = true
