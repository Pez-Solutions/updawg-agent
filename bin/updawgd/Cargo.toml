[package]
name = "updawgd"
description = "The Updawg agent daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "updawgd"
path = "src/main.rs"

[features]
# Adds --insecure-extra-root for testing against a local gateway. Never
# enabled in release builds.
insecure-extra-root = ["updawg-agent-core/insecure-extra-root"]

[dependencies]
updawg-agent-core.workspace = true
updawg-backends.workspace = true
updawg-collectors.workspace = true
updawg-crypto.workspace = true
updawg-protocol.workspace = true
updawg-snapshots.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
