# .deb and .rpm for both architectures. Built by the Release workflow:
#
#   ARCH=amd64 VERSION=0.1.0 RELEASE=20260929211500.g1154729 \
#     nfpm package -f packaging/nfpm/nfpm.yaml -p deb -t out/
#
# stage/ holds the binaries for ARCH and updawgd.service with ExecStart
# rewritten to /usr/bin. It's a fixed path because nfpm doesn't expand env
# vars in file sources.
name: updawg-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
version_schema: none
section: admin
priority: optional
maintainer: Pez Solutions <hello@updawg.net>
vendor: Pez Solutions
homepage: https://updawg.net
description: |-
  Updawg agent: reports this host's packages and runs the patch jobs
  your organization approved and signed.
  updawgd is the daemon and updawgctl enrols the host and shows its state.

contents:
  - src: stage/updawgd
    dst: /usr/bin/updawgd
    file_info: { mode: 0755 }
  - src: stage/updawgctl
    dst: /usr/bin/updawgctl
    file_info: { mode: 0755 }
  - src: stage/updawgd.service
    dst: /usr/lib/systemd/system/updawgd.service
    file_info: { mode: 0644 }
  # conffile / %config(noreplace): upgrades never overwrite an edited config.
  - src: packaging/agent.toml
    dst: /etc/updawg/agent.toml
    type: config|noreplace
    file_info: { mode: 0644 }

scripts:
  postinstall: packaging/nfpm/postinstall.sh
  preremove: packaging/nfpm/preremove.sh
  postremove: packaging/nfpm/postremove.sh
