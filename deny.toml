# cargo deny: runs in CI and daily on main.
#
# An advisory that can't be fixed yet goes in `advisories.ignore` with a
# `reason`.

[advisories]
# Flag unmaintained crates too.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences, and MPL-2.0 (file-level copyleft, fine to link).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates other than updawg-protocol aren't published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
