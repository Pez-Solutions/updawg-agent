# Tools for publishing to pkg.updawg.net: apt and dnf index builders, the
# signer, gcloud, and credentials for the signing identity (only usable from
# main, in the `release` environment).
name: pkg.updawg.net tools
description: apt-ftparchive, createrepo_c, updawg-release-sign and release-signer's credential.
outputs:
  sign:
    description: The signer binary.
    value: ${{ steps.build.outputs.sign }}
runs:
  using: composite
  steps:
    - name: apt-ftparchive and createrepo_c
      shell: sh
      run: |
        command -v apt-ftparchive >/dev/null && command -v createrepo_c >/dev/null ||
          (sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c)

    - name: the signer
      id: build
      shell: sh
      run: |
        rustup toolchain install stable --profile minimal
        cargo build --locked --release -p updawg-release-sign
        echo "sign=$PWD/target/release/updawg-release-sign" >> "$GITHUB_OUTPUT"

    # Last, after everything built or installed: from here on the job can
    # sign, and the steps that follow are this repository's scripts and the
    # pinned actions above.
    - id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: projects/736025852210/locations/global/workloadIdentityPools/github/providers/github
        service_account: release-signer@updawg-prod.iam.gserviceaccount.com
        token_format: access_token

    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: the signer's key and credential, for the steps after this
      shell: sh
      env:
        TOKEN: ${{ steps.auth.outputs.access_token }}
      run: |
        echo "::add-mask::$TOKEN"
        {
          echo "GOOGLE_OAUTH_ACCESS_TOKEN=$TOKEN"
          echo "UPDAWG_RELEASE_KEY=projects/updawg-prod/locations/europe-west3/keyRings/release-signing/cryptoKeys/packages/cryptoKeyVersions/1"
          echo "BUCKET=updawg-prod-packages"
        } >> "$GITHUB_ENV"
