name: Dependencies

# DAWG-165: advisories, licences and sources, with cargo deny. Daily on main,
# because an advisory published tomorrow is about code that is already
# released — a check that only runs when somebody pushes would never see it.
#
# On every change it runs as part of CI (`cargo deny` from updawg-server's rust.yml, DAWG-300);
# this is the daily run of the same job.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    uses: Pez-Solutions/updawg-server/.github/workflows/rust.yml@main
    with:
      check: false
