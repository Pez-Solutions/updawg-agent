name: Dependencies

# cargo deny (advisories, licences, sources). It also runs in CI on every
# change; this daily run catches advisories published after a release.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    uses: ./.github/workflows/rust.yml
    with:
      check: false
