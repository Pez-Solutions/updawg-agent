name: Release

# Every commit on main produces the agent as it is served from get.updawg.net
# (DAWG-44): static binaries, the unit, install.sh and a SHA256SUMS covering all
# of them. updawg-infra publishes the artifact; this only builds it.
#
# Two architectures (DAWG-41). x86_64's files stay at the top of the artifact,
# where every install.sh already in the world looks for them; aarch64's go in
# `aarch64/`, and one SHA256SUMS covers both.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: x86_64-unknown-linux-musl
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # musl, so one static binary runs on every supported distribution — CI
      # checks that it compiles; this is the only place it is linked.
      - name: Install Rust and musl
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl

      - name: build
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin updawgd --bin updawgctl

      - name: collect
        run: |
          mkdir -p out
          for b in updawgd updawgctl; do
            cp "target/x86_64-unknown-linux-musl/release/$b" "out/$b"
            strip "out/$b"
          done
          file out/updawgd | tee /dev/stderr | grep -Eq 'x86-64.*(statically linked|static-pie linked)'

      - uses: actions/upload-artifact@v4
        with:
          name: bin-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 1

  aarch64:
    name: aarch64-unknown-linux-musl
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 45
    env:
      CROSS_VERSION: v0.2.5
      # Of the release tarball, pinned: it builds what runs as root on other
      # people's servers.
      CROSS_SHA256: a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and cross
        run: |
          set -eu
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/cross.tar.gz" \
            "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-musl.tar.gz"
          echo "$CROSS_SHA256  $RUNNER_TEMP/cross.tar.gz" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/cross" && tar -xzf "$RUNNER_TEMP/cross.tar.gz" -C "$RUNNER_TEMP/cross"
          echo "$RUNNER_TEMP/cross" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-musl

      # In cross's container, which carries the aarch64 musl C toolchain that
      # aws-lc-rs needs; Docker is on the runners.
      - name: build
        run: |
          cross build --release --target aarch64-unknown-linux-musl \
            --bin updawgd --bin updawgctl

      - name: collect
        run: |
          mkdir -p out
          for b in updawgd updawgctl; do
            cp "target/aarch64-unknown-linux-musl/release/$b" "out/$b"
          done
          # Stripped with the container's own binutils: the runner's strip
          # does not know aarch64.
          docker run --rm -v "$PWD/out:/out" \
            "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5" \
            aarch64-linux-musl-strip /out/updawgd /out/updawgctl
          sudo chown -R "$(id -u):$(id -g)" out
          file out/updawgd | tee /dev/stderr | grep -Eq 'ARM aarch64.*(statically linked|static-pie linked)'

      - uses: actions/upload-artifact@v4
        with:
          name: bin-aarch64
          path: out/
          if-no-files-found: error
          retention-days: 1

  agent:
    name: assemble
    needs: [x86_64, aarch64]
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: bin-aarch64
          path: dist/aarch64/

      - name: collect
        run: |
          chmod 0755 dist/updawgd dist/updawgctl dist/aarch64/updawgd dist/aarch64/updawgctl
          cp packaging/install.sh dist/install.sh
          cp packaging/systemd/updawgd.service dist/updawgd.service
          git rev-parse HEAD > dist/REVISION
          # ⚠️ Paths relative to dist/. install.sh checks the download with
          # `sha256sum --check` in the directory it downloaded to, keeping the
          # `aarch64/` part, so a `dist/updawgd` line would match nothing.
          (cd dist && sha256sum updawgd updawgctl aarch64/updawgd aarch64/updawgctl \
            updawgd.service install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      # The name stays what updawg-infra's get role downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: updawg-agent-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30
