name: Release

# Builds the agent for every commit on main: static binaries, the systemd
# unit, install.sh and SHA256SUMS, as served from get.updawg.net. x86_64 files
# sit at the top level (where existing installers look), aarch64 under
# `aarch64/`.
#
# Also packages them as .deb and .rpm and tests install, upgrade and removal
# on each distro. On PRs this only runs when packaging or this file changes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Static musl build. CI only checks that it compiles; it's linked here.
      - name: Install Rust and musl
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl

      - name: build
        run: |
          # Same version string as the packages.
          export UPDAWG_BUILD=$(sh packaging/release-id.sh)
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin updawgd --bin updawgctl
          ./target/x86_64-unknown-linux-musl/release/updawgctl --version | grep -F -- "-$UPDAWG_BUILD"

      - name: collect
        run: |
          mkdir -p out
          for b in updawgd updawgctl; do
            cp "target/x86_64-unknown-linux-musl/release/$b" "out/$b"
            strip "out/$b"
          done
          file out/updawgd | tee /dev/stderr | grep -Eq 'x86-64.*(statically linked|static-pie linked)'

      - uses: actions/upload-artifact@v7
        with:
          name: bin-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 1

  aarch64:
    name: aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CROSS_VERSION: v0.2.5
      # Pinned release tarball.
      CROSS_SHA256: a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust and cross
        run: |
          set -eu
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/cross.tar.gz" \
            "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-musl.tar.gz"
          echo "$CROSS_SHA256  $RUNNER_TEMP/cross.tar.gz" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/cross" && tar -xzf "$RUNNER_TEMP/cross.tar.gz" -C "$RUNNER_TEMP/cross"
          echo "$RUNNER_TEMP/cross" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-musl

      # cross provides the aarch64 musl C toolchain aws-lc-rs needs.
      - name: build
        run: |
          # Passed through to the container by Cross.toml.
          export UPDAWG_BUILD=$(sh packaging/release-id.sh)
          cross build --release --target aarch64-unknown-linux-musl \
            --bin updawgd --bin updawgctl

      - name: collect
        run: |
          mkdir -p out
          for b in updawgd updawgctl; do
            cp "target/aarch64-unknown-linux-musl/release/$b" "out/$b"
          done
          # The runner's strip doesn't handle aarch64; use the container's.
          docker run --rm -v "$PWD/out:/out" \
            "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5" \
            aarch64-linux-musl-strip /out/updawgd /out/updawgctl
          sudo chown -R "$(id -u):$(id -g)" out
          file out/updawgd | tee /dev/stderr | grep -Eq 'ARM aarch64.*(statically linked|static-pie linked)'

      - uses: actions/upload-artifact@v7
        with:
          name: bin-aarch64
          path: out/
          if-no-files-found: error
          retention-days: 1

  agent:
    name: assemble
    needs: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: bin-aarch64
          path: dist/aarch64/

      - name: collect
        run: |
          chmod 0755 dist/updawgd dist/updawgctl dist/aarch64/updawgd dist/aarch64/updawgctl
          cp packaging/install.sh dist/install.sh
          cp packaging/systemd/updawgd.service dist/updawgd.service
          git rev-parse HEAD > dist/REVISION
          # Paths must be relative to dist/: install.sh runs
          # `sha256sum --check` from its download directory.
          (cd dist && sha256sum updawgd updawgctl aarch64/updawgd aarch64/updawgctl \
            updawgd.service install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      # Artifact name is referenced by the deploy, don't rename.
      - uses: actions/upload-artifact@v7
        with:
          name: updawg-agent-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  packages:
    name: .deb and .rpm
    needs: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64
          path: bin/amd64/

      - uses: actions/download-artifact@v8
        with:
          name: bin-aarch64
          path: bin/arm64/

      - name: Install nfpm
        env:
          NFPM: "2.47.0"
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          curl -fsSLo nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM}/nfpm_${NFPM}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tgz" | sha256sum -c -
          mkdir -p .nfpm && tar -xzf nfpm.tgz -C .nfpm nfpm

      # Version from Cargo.toml (a tag must match it), release from
      # packaging/release-id.sh.
      - name: build
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v${VERSION}, the version in Cargo.toml" >&2
            exit 1
          fi
          RELEASE=$(sh packaging/release-id.sh)
          # The binaries must report the same version, or self-update can't
          # tell it succeeded. Artifacts lose the executable bit.
          chmod +x bin/amd64/updawgctl
          bin/amd64/updawgctl --version 2>/dev/null | grep -F -- "${VERSION}-${RELEASE}" ||
            { file bin/amd64/updawgctl; echo "the binaries do not report ${VERSION}-${RELEASE}" >&2; exit 1; }
          echo "version ${VERSION}, release ${RELEASE}"
          export VERSION
          stage() {
            rm -rf stage && mkdir stage
            install -m 0755 "bin/$1/updawgd" "bin/$1/updawgctl" stage/
            sed 's|^ExecStart=/usr/local/bin/updawgd$|ExecStart=/usr/bin/updawgd|' \
              packaging/systemd/updawgd.service > stage/updawgd.service
            grep -q '^ExecStart=/usr/bin/updawgd$' stage/updawgd.service
          }
          mkdir -p out next
          for ARCH in amd64 arm64; do
            stage $ARCH
            for fmt in deb rpm; do
              ARCH=$ARCH RELEASE=$RELEASE .nfpm/nfpm package -f packaging/nfpm/nfpm.yaml -p $fmt -t out/
            done
          done
          # A second build one release ahead, for the upgrade test.
          stage amd64
          for fmt in deb rpm; do
            ARCH=amd64 RELEASE="${RELEASE}.1" .nfpm/nfpm package -f packaging/nfpm/nfpm.yaml -p $fmt -t next/
          done
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out next

      - uses: actions/upload-artifact@v7
        with:
          name: updawg-agent-packages
          path: out/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: packages-next
          path: next/
          if-no-files-found: error
          retention-days: 1

  packages-test:
    name: packages on the distro matrix
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-packages
          path: out/

      - uses: actions/download-artifact@v8
        with:
          name: packages-next
          path: next/

      - name: install, upgrade, remove
        run: |
          deb_old=$(ls out/*_amd64.deb) deb_new=$(ls next/*_amd64.deb)
          rpm_old=$(ls out/*.x86_64.rpm) rpm_new=$(ls next/*.x86_64.rpm)
          mkdir -p logs
          pids=
          for image in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04 rockylinux/rockylinux:9 almalinux:8; do
            case "$image" in
              debian* | ubuntu*) old=$deb_old new=$deb_new ;;
              *) old=$rpm_old new=$rpm_new ;;
            esac
            log=logs/$(echo "$image" | tr '/:' '__').log
            ( docker run --rm -v "$PWD:/w" -w /w "$image" sh packaging/nfpm/test.sh "$old" "$new" \
                > "$log" 2>&1 && echo ok >> "$log.status" || echo failed >> "$log.status" ) &
            pids="$pids $!"
          done
          wait $pids
          failed=
          for log in logs/*.log; do
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
            [ "$(cat "$log.status")" = ok ] || failed="$failed $log"
          done
          [ -z "$failed" ] || { echo "FAILED:$failed"; exit 1; }

  # Publish every main build that passed the package tests to the beta
  # channel. Stable is promote.yml. Gated on the PKG_PUBLISH repo variable.
  publish:
    name: publish to pkg.updawg.net (beta)
    needs: [packages, packages-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PKG_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Each publish rebuilds the channel index, so they can't overlap.
    concurrency:
      group: pkg-updawg-net
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-packages
          path: out/

      # Binaries for self-update on hosts installed without a package.
      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-linux-x86_64
          path: dist/

      - id: tools
        uses: ./.github/actions/pkg-tools

      # Refuse a build that sorts below beta's current one (dpkg ordering).
      - name: newer than beta
        run: |
          NEW=$(ls out/*_amd64.deb | sed 's/.*updawg-agent_\(.*\)_amd64\.deb/\1/')
          CURRENT=$(curl -fsS https://pkg.updawg.net/bin/beta.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' || true)
          echo "this build: $NEW; beta: ${CURRENT:-nothing yet}"
          if [ -n "$CURRENT" ] && ! dpkg --compare-versions "$NEW" gt "$CURRENT"; then
            echo "$NEW does not sort after $CURRENT, which beta holds: was the version lowered?" >&2
            exit 1
          fi

      - name: publish
        env:
          SIGN: ${{ steps.tools.outputs.sign }}
        run: sh packaging/repo/publish.sh beta out/*.deb out/*.rpm

      # After the packages, so the manifest never names a build apt and dnf
      # can't install yet.
      - name: the beta self-update manifest
        env:
          SIGN: ${{ steps.tools.outputs.sign }}
        run: |
          # Not bin/, which holds the crates.
          mkdir -p release-bin/x86_64-unknown-linux-musl release-bin/aarch64-unknown-linux-musl
          cp dist/updawgd dist/updawgctl release-bin/x86_64-unknown-linux-musl/
          cp dist/aarch64/updawgd dist/aarch64/updawgctl release-bin/aarch64-unknown-linux-musl/
          chmod 0755 release-bin/*/*
          VERSION=$(release-bin/x86_64-unknown-linux-musl/updawgctl --version | awk '{print $2}')
          sh packaging/repo/publish-bin.sh beta "$VERSION" release-bin

