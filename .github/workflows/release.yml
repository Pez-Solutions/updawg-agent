name: Release

# Builds the agent for every commit on main: static binaries, the systemd
# unit, install.sh and SHA256SUMS, as served from get.updawg.net. x86_64 files
# sit at the top level (where existing installers look), aarch64 under
# `aarch64/`.
#
# Also packages them as .deb and .rpm and tests install, upgrade and removal
# on each distro. On PRs this only runs when packaging or this file changes.
#
# Builds are reproducible: `reproducible` rebuilds every build from a fresh
# checkout and compares the bytes, and `provenance` attests each build and
# publishes the attestation beside the packages.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - ".github/actions/cross/**"
      - ".github/actions/nfpm/**"
      - "Cross.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Static musl in cross's pinned image, like aarch64: the C toolchain is
      # part of the output bytes.
      - uses: ./.github/actions/cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl

      - name: build
        run: sh packaging/build.sh x86_64-unknown-linux-musl out

      - uses: actions/upload-artifact@v7
        with:
          name: bin-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 1

  aarch64:
    name: aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-musl

      # cross provides the aarch64 musl C toolchain aws-lc-rs needs.
      - name: build
        run: sh packaging/build.sh aarch64-unknown-linux-musl out

      - uses: actions/upload-artifact@v7
        with:
          name: bin-aarch64
          path: out/
          if-no-files-found: error
          retention-days: 1

  agent:
    name: assemble
    needs: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: bin-aarch64
          path: dist/aarch64/

      - name: collect
        run: |
          chmod 0755 dist/updawgd dist/updawgctl dist/aarch64/updawgd dist/aarch64/updawgctl
          cp packaging/install.sh dist/install.sh
          cp packaging/systemd/updawgd.service dist/updawgd.service
          git rev-parse HEAD > dist/REVISION
          # Paths must be relative to dist/: install.sh runs
          # `sha256sum --check` from its download directory.
          (cd dist && sha256sum updawgd updawgctl aarch64/updawgd aarch64/updawgctl \
            updawgd.service install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      # Artifact name is referenced by the deploy, don't rename.
      - uses: actions/upload-artifact@v7
        with:
          name: updawg-agent-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  packages:
    name: .deb and .rpm
    needs: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64
          path: bin/amd64/

      - uses: actions/download-artifact@v8
        with:
          name: bin-aarch64
          path: bin/arm64/

      - uses: ./.github/actions/nfpm

      # Version from Cargo.toml (a tag must match it), release from
      # packaging/release-id.sh.
      - name: build
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v${VERSION}, the version in Cargo.toml" >&2
            exit 1
          fi
          RELEASE=$(sh packaging/release-id.sh)
          # The binaries must report the same version, or self-update can't
          # tell it succeeded. Artifacts lose the executable bit.
          chmod +x bin/amd64/updawgctl
          bin/amd64/updawgctl --version 2>/dev/null | grep -F -- "${VERSION}-${RELEASE}" ||
            { file bin/amd64/updawgctl; echo "the binaries do not report ${VERSION}-${RELEASE}" >&2; exit 1; }
          echo "version ${VERSION}, release ${RELEASE}"
          for ARCH in amd64 arm64; do
            sh packaging/nfpm/package.sh $ARCH bin/$ARCH out
          done
          # A second build one release ahead, for the upgrade test.
          sh packaging/nfpm/package.sh amd64 bin/amd64 next "${RELEASE}.1"
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out next

      - uses: actions/upload-artifact@v7
        with:
          name: updawg-agent-packages
          path: out/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: packages-next
          path: next/
          if-no-files-found: error
          retention-days: 1

  packages-test:
    name: packages on the distro matrix
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-packages
          path: out/

      - uses: actions/download-artifact@v8
        with:
          name: packages-next
          path: next/

      - name: install, upgrade, remove
        run: |
          deb_old=$(ls out/*_amd64.deb) deb_new=$(ls next/*_amd64.deb)
          rpm_old=$(ls out/*.x86_64.rpm) rpm_new=$(ls next/*.x86_64.rpm)
          mkdir -p logs
          pids=
          for image in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04 rockylinux/rockylinux:9 almalinux:8; do
            case "$image" in
              debian* | ubuntu*) old=$deb_old new=$deb_new ;;
              *) old=$rpm_old new=$rpm_new ;;
            esac
            log=logs/$(echo "$image" | tr '/:' '__').log
            ( docker run --rm -v "$PWD:/w" -w /w "$image" sh packaging/nfpm/test.sh "$old" "$new" \
                > "$log" 2>&1 && echo ok >> "$log.status" || echo failed >> "$log.status" ) &
            pids="$pids $!"
          done
          wait $pids
          failed=
          for log in logs/*.log; do
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
            [ "$(cat "$log.status")" = ok ] || failed="$failed $log"
          done
          [ -z "$failed" ] || { echo "FAILED:$failed"; exit 1; }

  # Rebuilds x86_64's binaries and packages from a fresh checkout on another
  # machine, with a cold cache and another time zone, and compares the bytes.
  # Nothing publishes unless they match. aarch64 is the same script in another
  # image, so it isn't rebuilt.
  reproducible:
    name: rebuilt elsewhere, byte for byte
    needs: [x86_64, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: rebuild/somewhere-else

      - uses: ./rebuild/somewhere-else/.github/actions/cross

      - name: build
        working-directory: rebuild/somewhere-else
        env:
          TZ: Pacific/Kiritimati
        run: sh packaging/build.sh x86_64-unknown-linux-musl "$RUNNER_TEMP/rebuilt/bin"

      # Into the workspace's .nfpm/, which is outside the rebuild's checkout.
      - uses: ./rebuild/somewhere-else/.github/actions/nfpm

      - name: package
        working-directory: rebuild/somewhere-else
        env:
          TZ: Pacific/Kiritimati
          NFPM: ${{ github.workspace }}/.nfpm/nfpm
        run: sh packaging/nfpm/package.sh amd64 "$RUNNER_TEMP/rebuilt/bin" "$RUNNER_TEMP/rebuilt/pkg"

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64
          path: released/bin/

      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-packages
          path: released/pkg/

      - name: compare
        run: |
          set -u
          r=$RUNNER_TEMP/rebuilt
          : > pairs
          for b in updawgd updawgctl; do echo "released/bin/$b $r/bin/$b" >> pairs; done
          for f in "$r"/pkg/*; do echo "released/pkg/$(basename "$f") $f" >> pairs; done
          : > differ
          while read -r a b; do
            sa=$(sha256sum < "$a" | cut -d' ' -f1)
            sb=$(sha256sum < "$b" | cut -d' ' -f1)
            if [ "$sa" = "$sb" ]; then
              echo "same      $sa  $(basename "$a")"
            else
              echo "DIFFERENT $sa  $a"
              echo "          $sb  $b"
              echo "$a $b" >> differ
            fi
          done < pairs
          [ -s differ ] || exit 0
          echo "::error::the rebuild is not byte for byte the release build"
          command -v diffoscope >/dev/null ||
            (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends diffoscope) || true
          mkdir -p diffoscope
          while read -r a b; do
            report="diffoscope/$(basename "$a").txt"
            diffoscope --text "$report" --max-report-size 20000000 "$a" "$b" || true
            head -c 20000 "$report" || true
          done < differ
          exit 1

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diffoscope
          path: diffoscope/
          if-no-files-found: ignore
          retention-days: 14

  # SLSA build provenance for every file a host is given, as GitHub artifact
  # attestations for this workflow and commit. The Sigstore bundle is
  # published beside the packages, so anyone can check it:
  #
  #   gh attestation verify FILE --bundle <version>.sigstore.json \
  #     --repo Pez-Solutions/updawg-agent \
  #     --signer-workflow Pez-Solutions/updawg-agent/.github/workflows/release.yml \
  #     --source-ref refs/heads/main
  #
  # Runs on PRs too, so changes here are tried before main (those name the
  # PR's ref and fail --source-ref). This is in addition to the release key's
  # signatures, which apt, dnf and self-update still check.
  provenance:
    name: build provenance
    needs: [agent, packages, reproducible]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-linux-x86_64
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-packages
          path: out/

      - id: attest
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/updawgd
            dist/updawgctl
            dist/aarch64/updawgd
            dist/aarch64/updawgctl
            dist/install.sh
            dist/updawgd.service
            out/*.deb
            out/*.rpm

      # The command from the docs, with a pinned gh: the runner's is too old
      # for `gh attestation`.
      - name: verify, as a customer would
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_CLI: "2.102.0"
          GH_CLI_SHA256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/gh.tgz" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI}/gh_${GH_CLI}_linux_amd64.tar.gz"
          echo "${GH_CLI_SHA256}  $RUNNER_TEMP/gh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          gh="$RUNNER_TEMP/gh_${GH_CLI}_linux_amd64/bin/gh"
          cp "$BUNDLE" provenance.sigstore.json
          for f in out/*_amd64.deb dist/updawgd; do
            "$gh" attestation verify "$f" --bundle provenance.sigstore.json \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF"
          done
          # And again with no token and a trusted root fetched beforehand, as
          # someone outside the org would.
          "$gh" attestation trusted-root > trusted_root.jsonl
          env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="$RUNNER_TEMP/gh-nobody" \
            "$gh" attestation verify out/*_amd64.deb --bundle provenance.sigstore.json \
            --custom-trusted-root trusted_root.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"

      - uses: actions/upload-artifact@v7
        with:
          name: updawg-agent-provenance
          path: provenance.sigstore.json
          if-no-files-found: error
          retention-days: 30

  # Publish every main build that passed the package tests to the beta
  # channel. Stable is promote.yml. Gated on the PKG_PUBLISH repo variable.
  publish:
    name: publish to pkg.updawg.net (beta)
    needs: [packages, packages-test, reproducible, provenance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PKG_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Each publish rebuilds the channel index, so they can't overlap.
    concurrency:
      group: pkg-updawg-net
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-packages
          path: out/

      # Binaries for self-update on hosts installed without a package.
      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-linux-x86_64
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: updawg-agent-provenance
          path: provenance/

      - id: tools
        uses: ./.github/actions/pkg-tools

      # Refuse a build that sorts below beta's current one (dpkg ordering).
      - name: newer than beta
        run: |
          NEW=$(ls out/*_amd64.deb | sed 's/.*updawg-agent_\(.*\)_amd64\.deb/\1/')
          CURRENT=$(curl -fsS https://pkg.updawg.net/bin/beta.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' || true)
          echo "this build: $NEW; beta: ${CURRENT:-nothing yet}"
          if [ -n "$CURRENT" ] && ! dpkg --compare-versions "$NEW" gt "$CURRENT"; then
            echo "$NEW does not sort after $CURRENT, which beta holds: was the version lowered?" >&2
            exit 1
          fi

      # Before the packages, so nothing is published without it. Written once
      # to provenance/<version>.sigstore.json like a pool file; promote moves
      # the same files to stable.
      - name: the provenance
        run: |
          set -eu
          NEW=$(ls out/*_amd64.deb | sed 's/.*updawg-agent_\(.*\)_amd64\.deb/\1/')
          object="gs://$BUCKET/provenance/$NEW.sigstore.json"
          gcloud storage cp --no-clobber --cache-control="public, max-age=31536000, immutable" \
            --content-type=application/json provenance/provenance.sigstore.json "$object"
          echo "https://pkg.updawg.net/provenance/$NEW.sigstore.json"

      - name: publish
        env:
          SIGN: ${{ steps.tools.outputs.sign }}
        run: sh packaging/repo/publish.sh beta out/*.deb out/*.rpm

      # After the packages, so the manifest never names a build apt and dnf
      # can't install yet.
      - name: the beta self-update manifest
        env:
          SIGN: ${{ steps.tools.outputs.sign }}
        run: |
          # Not bin/, which holds the crates.
          mkdir -p release-bin/x86_64-unknown-linux-musl release-bin/aarch64-unknown-linux-musl
          cp dist/updawgd dist/updawgctl release-bin/x86_64-unknown-linux-musl/
          cp dist/aarch64/updawgd dist/aarch64/updawgctl release-bin/aarch64-unknown-linux-musl/
          chmod 0755 release-bin/*/*
          VERSION=$(release-bin/x86_64-unknown-linux-musl/updawgctl --version | awk '{print $2}')
          sh packaging/repo/publish-bin.sh beta "$VERSION" release-bin

