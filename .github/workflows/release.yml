name: Release

# Every commit on main produces the agent as it is served from get.updawg.net
# (DAWG-44): static binaries, the unit, install.sh and a SHA256SUMS covering all
# of them. updawg-infra publishes the artifact; this only builds it.
#
# Two architectures (DAWG-41). x86_64's files stay at the top of the artifact,
# where every install.sh already in the world looks for them; aarch64's go in
# `aarch64/`, and one SHA256SUMS covers both.
#
# And the same binaries as .deb and .rpm (DAWG-42), tested through install,
# upgrade and removal on each distribution. On a pull request only when the
# packaging or this workflow changes: that is when there is something new to
# test.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: x86_64-unknown-linux-musl
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # musl, so one static binary runs on every supported distribution — CI
      # checks that it compiles; this is the only place it is linked.
      - name: Install Rust and musl
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl

      - name: build
        run: |
          # The version it reports is the packages' (DAWG-46).
          export UPDAWG_BUILD=$(sh packaging/release-id.sh)
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin updawgd --bin updawgctl
          ./target/x86_64-unknown-linux-musl/release/updawgctl --version | grep -F -- "-$UPDAWG_BUILD"

      - name: collect
        run: |
          mkdir -p out
          for b in updawgd updawgctl; do
            cp "target/x86_64-unknown-linux-musl/release/$b" "out/$b"
            strip "out/$b"
          done
          file out/updawgd | tee /dev/stderr | grep -Eq 'x86-64.*(statically linked|static-pie linked)'

      - uses: actions/upload-artifact@v4
        with:
          name: bin-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 1

  aarch64:
    name: aarch64-unknown-linux-musl
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 45
    env:
      CROSS_VERSION: v0.2.5
      # Of the release tarball, pinned: it builds what runs as root on other
      # people's servers.
      CROSS_SHA256: a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and cross
        run: |
          set -eu
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/cross.tar.gz" \
            "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-musl.tar.gz"
          echo "$CROSS_SHA256  $RUNNER_TEMP/cross.tar.gz" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/cross" && tar -xzf "$RUNNER_TEMP/cross.tar.gz" -C "$RUNNER_TEMP/cross"
          echo "$RUNNER_TEMP/cross" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-musl

      # In cross's container, which carries the aarch64 musl C toolchain that
      # aws-lc-rs needs; Docker is on the runners.
      - name: build
        run: |
          # Through Cross.toml's passthrough into the container.
          export UPDAWG_BUILD=$(sh packaging/release-id.sh)
          cross build --release --target aarch64-unknown-linux-musl \
            --bin updawgd --bin updawgctl

      - name: collect
        run: |
          mkdir -p out
          for b in updawgd updawgctl; do
            cp "target/aarch64-unknown-linux-musl/release/$b" "out/$b"
          done
          # Stripped with the container's own binutils: the runner's strip
          # does not know aarch64.
          docker run --rm -v "$PWD/out:/out" \
            "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5" \
            aarch64-linux-musl-strip /out/updawgd /out/updawgctl
          sudo chown -R "$(id -u):$(id -g)" out
          file out/updawgd | tee /dev/stderr | grep -Eq 'ARM aarch64.*(statically linked|static-pie linked)'

      - uses: actions/upload-artifact@v4
        with:
          name: bin-aarch64
          path: out/
          if-no-files-found: error
          retention-days: 1

  agent:
    name: assemble
    needs: [x86_64, aarch64]
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: bin-aarch64
          path: dist/aarch64/

      - name: collect
        run: |
          chmod 0755 dist/updawgd dist/updawgctl dist/aarch64/updawgd dist/aarch64/updawgctl
          cp packaging/install.sh dist/install.sh
          cp packaging/systemd/updawgd.service dist/updawgd.service
          git rev-parse HEAD > dist/REVISION
          # ⚠️ Paths relative to dist/. install.sh checks the download with
          # `sha256sum --check` in the directory it downloaded to, keeping the
          # `aarch64/` part, so a `dist/updawgd` line would match nothing.
          (cd dist && sha256sum updawgd updawgctl aarch64/updawgd aarch64/updawgctl \
            updawgd.service install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      # The name stays what updawg-infra's get role downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: updawg-agent-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  packages:
    name: .deb and .rpm
    needs: [x86_64, aarch64]
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64
          path: bin/amd64/

      - uses: actions/download-artifact@v4
        with:
          name: bin-aarch64
          path: bin/arm64/

      - name: Install nfpm
        env:
          NFPM: "2.47.0"
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          curl -fsSLo nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM}/nfpm_${NFPM}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tgz" | sha256sum -c -
          mkdir -p .nfpm && tar -xzf nfpm.tgz -C .nfpm nfpm

      # A tag is its version; anything else the workspace version. The
      # release is packaging/release-id.sh's.
      - name: build
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          fi
          RELEASE=$(sh packaging/release-id.sh)
          # The binaries say the same, or a self-update could never tell it
          # had arrived (DAWG-46).
          # Artifacts lose the executable bit on the way.
          chmod +x bin/amd64/updawgctl
          bin/amd64/updawgctl --version 2>/dev/null | grep -F -- "${VERSION}-${RELEASE}" ||
            { file bin/amd64/updawgctl; echo "the binaries do not report ${VERSION}-${RELEASE}" >&2; exit 1; }
          echo "version ${VERSION}, release ${RELEASE}"
          export VERSION
          stage() {
            rm -rf stage && mkdir stage
            install -m 0755 "bin/$1/updawgd" "bin/$1/updawgctl" stage/
            sed 's|^ExecStart=/usr/local/bin/updawgd$|ExecStart=/usr/bin/updawgd|' \
              packaging/systemd/updawgd.service > stage/updawgd.service
            grep -q '^ExecStart=/usr/bin/updawgd$' stage/updawgd.service
          }
          mkdir -p out next
          for ARCH in amd64 arm64; do
            stage $ARCH
            for fmt in deb rpm; do
              ARCH=$ARCH RELEASE=$RELEASE .nfpm/nfpm package -f packaging/nfpm/nfpm.yaml -p $fmt -t out/
            done
          done
          # The same, one release on, for the upgrade test and nothing else.
          stage amd64
          for fmt in deb rpm; do
            ARCH=amd64 RELEASE="${RELEASE}.1" .nfpm/nfpm package -f packaging/nfpm/nfpm.yaml -p $fmt -t next/
          done
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out next

      - uses: actions/upload-artifact@v4
        with:
          name: updawg-agent-packages
          path: out/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: packages-next
          path: next/
          if-no-files-found: error
          retention-days: 1

  packages-test:
    name: packages on ${{ matrix.image }}
    needs: packages
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux/rockylinux:9
          - almalinux:8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: updawg-agent-packages
          path: out/

      - uses: actions/download-artifact@v4
        with:
          name: packages-next
          path: next/

      - name: install, upgrade, remove
        run: |
          case "${{ matrix.image }}" in
            debian* | ubuntu*) old=$(ls out/*_amd64.deb); new=$(ls next/*_amd64.deb) ;;
            *) old=$(ls out/*.x86_64.rpm); new=$(ls next/*.x86_64.rpm) ;;
          esac
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" \
            sh packaging/nfpm/test.sh "$old" "$new"

  # Every build of main, onto pkg.updawg.net's beta channel (DAWG-45), once
  # its packages installed, upgraded and removed cleanly everywhere above.
  # `stable` is the promote button: .github/workflows/promote.yml (DAWG-46).
  #
  # Off until the key, the identity and the bucket exist: they are in
  # updawg-infra's terraform/gcp, which a person applies. Set the repository
  # variable PKG_PUBLISH to `true` after that apply.
  publish:
    name: publish to pkg.updawg.net (beta)
    needs: [packages, packages-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PKG_PUBLISH == 'true'
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 20
    # One publish at a time: each rebuilds a channel's indexes from its list,
    # and two interleaved would each drop the other's build.
    concurrency:
      group: pkg-updawg-net
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: updawg-agent-packages
          path: out/

      - id: tools
        uses: ./.github/actions/pkg-tools

      - name: publish
        env:
          SIGN: ${{ steps.tools.outputs.sign }}
        run: sh packaging/repo/publish.sh beta out/*.deb out/*.rpm

