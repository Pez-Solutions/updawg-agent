name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The version only goes up (packaging/bump-version.sh). Lowered on main,
  # every build after it would sort below the ones hosts already have.
  version:
    name: the version does not go backwards
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, copenhagen]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: compare with ${{ github.base_ref }}
        run: |
          version() { sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p'; }
          HERE=$(version < Cargo.toml)
          BASE=$(git show "origin/${{ github.base_ref }}:Cargo.toml" | version)
          echo "this branch: $HERE; ${{ github.base_ref }}: $BASE"
          if ! dpkg --compare-versions "$HERE" ge "$BASE"; then
            echo "the version went from $BASE to $HERE; it only goes up (packaging/bump-version.sh)" >&2
            exit 1
          fi

  check:
    name: fmt, clippy, test
    runs-on: [self-hosted, copenhagen]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # Formatting first: it is the fastest signal and the least interesting
      # thing to argue about in review.
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The release signer's tests hand what it writes to the verifiers apt
      # and dnf use (DAWG-45). Required, so a runner without them fails
      # instead of passing having verified nothing; sqv is best effort, as
      # not every runner's release packages it.
      - name: OpenPGP verifiers for the release signer's tests
        run: |
          command -v gpgv >/dev/null || (sudo apt-get update && sudo apt-get install -y gpgv)
          command -v sqv >/dev/null || sudo apt-get install -y sqv || true

      - name: test
        run: cargo test --workspace
        env:
          UPDAWG_REQUIRE_GPGV: "1"

      # `insecure-extra-root` is off by default and a release does not set it,
      # so nothing above compiles a line of it. A feature-gated module whose
      # tests never run in CI is a module that is already broken and does not
      # know it yet.
      - name: the insecure-extra-root feature builds, lints and passes its tests
        run: |
          cargo clippy --workspace --all-targets \
            --features updawgd/insecure-extra-root,updawgctl/insecure-extra-root -- -D warnings
          cargo test --workspace \
            --features updawgd/insecure-extra-root,updawgctl/insecure-extra-root

      # And the property the feature exists for: with it off, the flag is not
      # something the binary refuses, it is something the binary has never
      # heard of. This is the check, because it is the whole argument.
      - name: a default build has never heard of --insecure-extra-root
        run: |
          cargo build --bin updawgctl
          out=$(./target/debug/updawgctl --insecure-extra-root /dev/null status 2>&1 || true)
          echo "$out"
          case "$out" in
            *"unexpected argument"*) echo "ok: the flag does not exist here" ;;
            *) echo "FAIL: a default build accepted --insecure-extra-root"; exit 1 ;;
          esac

      # The agent is statically linked against musl so one build per
      # architecture runs on every supported distro. Checking it here stops a
      # dependency that needs glibc from landing unnoticed.
      - name: check musl target builds
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo check --workspace --target x86_64-unknown-linux-musl

  # Advisories, licences and sources are dependencies.yml (DAWG-165), which
  # also runs daily.

  # install.sh is piped into a root shell on somebody else's machine (DAWG-44).
  # Lint it, and prove the refusals refuse — before anything is downloaded or
  # changed — on the platforms it must turn away.
  install-sh:
    name: install.sh
    runs-on: [self-hosted, copenhagen]
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s sh packaging/install.sh
      - name: short enough to read before running
        run: test "$(wc -l < packaging/install.sh)" -lt 150
      - name: refuses what it does not support, and changes nothing
        run: |
          refuse() {
            image=$1; want=$2
            out=$(docker run --rm -v "$PWD/packaging:/p:ro" "$image" sh /p/install.sh 2>&1) && {
              echo "FAIL: $image was not refused"; exit 1; }
            echo "$image: $out"
            case "$out" in *"$want"*) ;; *) echo "FAIL: expected '$want'"; exit 1 ;; esac
            case "$out" in *"Nothing was changed"*|*"run as root"*) ;; *) echo "FAIL: no promise"; exit 1 ;; esac
          }
          refuse alpine:3 "is not supported"
          # Debian with no systemd in the container: refused before download.
          refuse debian:13 "no systemctl"

      # The real thing, from pkg.updawg.net's beta channel, in stock images:
      # key, repository, package, and a host an older install.sh set up handed
      # over to the package with its config kept. No systemd in a container,
      # so systemctl is a stub that says yes; the package's own scripts skip
      # systemd when it is not running.
      - name: installs from the signed repository
        run: |
          install_ok() {
            docker run --rm -v "$PWD/packaging:/p:ro" "$1" sh -ec '
              command -v curl >/dev/null 2>&1 ||
                { apt-get update -qq && apt-get install -y -qq curl ca-certificates; } >/dev/null 2>&1
              printf "#!/bin/sh\nexit 0\n" > /usr/local/bin/systemctl && chmod +x /usr/local/bin/systemctl
              # As an older install.sh left a host: its binary, its unit, an edited config.
              mkdir -p /etc/systemd/system /etc/updawg
              echo "ExecStart=/usr/local/bin/updawgd" > /etc/systemd/system/updawgd.service
              touch /usr/local/bin/updawgd /usr/local/bin/updawgctl
              printf "server = \"https://agents.updawg.net\"\nmode = \"observe\"\n" > /etc/updawg/agent.toml
              UPDAWG_CHANNEL=beta sh /p/install.sh
              /usr/bin/updawgctl --version
              test ! -e /usr/local/bin/updawgd && test ! -e /etc/systemd/system/updawgd.service
              grep -q "mode = \"observe\"" /etc/updawg/agent.toml
            ' || { echo "FAIL: $1"; exit 1; }
            echo "$1: installed"
          }
          for image in debian:13 ubuntu:22.04 rockylinux/rockylinux:9 amazonlinux:2023; do
            install_ok "$image"
          done

  # The agent on every distribution it supports (DAWG-40): the real updawgctl
  # enrolls and the real updawgd checks in and uploads an inventory, in a
  # container of each, against a fake gateway that records what it got
  # (crates/updawg-agent-core/examples/fake_gateway.rs). Built once with
  # insecure-extra-root, which only this build has, so the agent trusts the
  # fake's CA.
  distros:
    name: agent on the distro matrix
    runs-on: [self-hosted, copenhagen]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust and musl
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          command -v musl-gcc >/dev/null || (sudo apt-get update && sudo apt-get install -y musl-tools)

      - uses: Swatinem/rust-cache@v2
        with:
          key: distro-matrix

      # Not into bin/: that is where the updawgd and updawgctl crates live.
      - name: build
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            -p updawgd -p updawgctl \
            --features updawgd/insecure-extra-root,updawgctl/insecure-extra-root
          cargo build --release -p updawg-agent-core --example fake_gateway
          mkdir -p mbin
          cp target/x86_64-unknown-linux-musl/release/updawgd target/x86_64-unknown-linux-musl/release/updawgctl mbin/
          cp target/release/examples/fake_gateway mbin/

      # All of them at once, in one job: twelve jobs of half a minute each
      # held twelve runner slots and starved main's release jobs.
      - name: enroll, check in, upload an inventory
        run: |
          sh .github/distros/run.sh \
            debian:12 debian \
            debian:13 debian \
            ubuntu:20.04 ubuntu \
            ubuntu:22.04 ubuntu \
            ubuntu:24.04 ubuntu \
            rockylinux/rockylinux:8 rocky \
            rockylinux/rockylinux:9 rocky \
            almalinux:8 almalinux \
            almalinux:9 almalinux \
            oraclelinux:8 ol \
            oraclelinux:9 ol \
            redhat/ubi9 rhel
