name: Promote

# Promote a build from beta to the stable channel on pkg.updawg.net. Nothing
# is rebuilt; stable's indexes start pointing at the same pool files.
#
# Must run from `main`, the only ref allowed to use the signing identity.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "The build, as its packages name it: 0.1.0-20260930183310.g8c53d52"
        required: true
        type: string

concurrency:
  group: pkg-updawg-net
  cancel-in-progress: false

jobs:
  promote:
    name: promote ${{ inputs.release }} to stable
    if: github.ref == 'refs/heads/main'
    # Approved like publish in release.yml, for the same reason.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      # to look up the build's provenance on GitHub
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tools
        uses: ./.github/actions/pkg-tools

      # Passed via env, not interpolated into the script.
      - name: that build's packages, from beta
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          printf '%s' "$RELEASE" | grep -Eq '^[0-9][0-9A-Za-z.+~-]*$' ||
            { echo "not a build: $RELEASE" >&2; exit 1; }
          gcloud storage cat "gs://$BUCKET/channels/beta.txt" |
            grep -F -e "_${RELEASE}_" -e "-${RELEASE}." > files || true
          cat files
          [ "$(wc -l < files)" -eq 4 ] ||
            { echo "beta does not hold that build's four packages" >&2; exit 1; }
          mkdir promote
          sed "s|^|gs://$BUCKET/|" files | gcloud storage cp --read-paths-from-stdin promote/

      # Older builds have no binaries in the pool; the manifest steps below
      # leave stable.json alone for those.
      - name: that build's binaries, from the pool
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if ! gcloud storage ls "gs://$BUCKET/bin/pool/$RELEASE/" >/dev/null 2>&1; then
            echo "::warning::$RELEASE has no binaries in bin/pool (built before self-update)"
            exit 0
          fi
          # Not bin/, which holds the crates.
          mkdir release-bin
          gcloud storage cp -r "gs://$BUCKET/bin/pool/$RELEASE/*" release-bin/

      # Everything about to be signed for stable came from the bucket, which
      # is not enough to trust it: each file must be one that release.yml
      # built from main and attested, looked up on GitHub by its digest.
      - name: every file is one main's release built
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CLI: "2.102.0"
          GH_CLI_SHA256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/gh.tgz" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI}/gh_${GH_CLI}_linux_amd64.tar.gz"
          echo "${GH_CLI_SHA256}  $RUNNER_TEMP/gh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          gh="$RUNNER_TEMP/gh_${GH_CLI}_linux_amd64/bin/gh"
          files=$(find promote release-bin -type f 2>/dev/null | sort)
          [ "$(echo "$files" | grep -c '^promote/')" -eq 4 ] ||
            { echo "expected four packages in promote/" >&2; exit 1; }
          for f in $files; do
            "$gh" attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main
          done

      - name: publish
        env:
          SIGN: ${{ steps.tools.outputs.sign }}
        run: sh packaging/repo/publish.sh stable promote/*

      # Re-sign the build's binaries as stable's self-update manifest.
      - name: the stable self-update manifest
        env:
          SIGN: ${{ steps.tools.outputs.sign }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ ! -d release-bin ]; then
            echo "::warning::$RELEASE has no binaries in bin/pool; bin/stable.json is unchanged"
            exit 0
          fi
          sh packaging/repo/publish-bin.sh stable "$RELEASE" release-bin

      # get.updawg.net serves stable: the installer and the promoted
      # binaries for manual installs.
      - name: get.updawg.net
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ ! -d release-bin ]; then
            echo "::warning::$RELEASE has no binaries in bin/pool; get.updawg.net is unchanged"
            exit 0
          fi
          sh packaging/repo/publish-get.sh "$RELEASE" release-bin
